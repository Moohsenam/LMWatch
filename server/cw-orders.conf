# /etc/cw-orders.conf — the one file that decides where the service listens.
#
# Change a line, then:  systemctl restart cw-orders
#
# CW_URLS is what Kestrel actually binds. Behind nginx, Apache or Caddy it stays
# on the loopback, so nothing reaches the service except through them. With no
# web server in front, use 0.0.0.0 and open the port in the firewall.

CW_DATA=/var/lib/cw-orders
CW_PORT=5080
CW_URLS=http://127.0.0.1:5080
DOTNET_EnableDiagnostics=0
